[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kernelbot"
version = "0.0.2"
description = "A simple, but extensible Python implementation for the KernelGram Bot API. Telebot-compatible."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "ReaalRick", email = "rickReaal@proton.me" }]
keywords = ["kernelgram", "bot", "api", "telebot"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "requests>=2.28.0",
]

[project.urls]
Homepage = "https://github.com/ReaalRick/kernelbot"
Repository = "https://github.com/ReaalRick/kernelbot"
Issues = "https://github.com/ReaalRick/kernelbot/issues"

[tool.setuptools]
packages = ["kernelbot"]
